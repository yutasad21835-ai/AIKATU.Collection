<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイカツ！アンコール カード帳</title>
<style>
:root{
  --pink:#ff62ad;
  --hot:#ff3f93;
  --lav:#9b75ef;
  --sky:#77d9ff;
  --gold:#ffd76b;
  --cream:#fffaff;
  --text:#5b4866;
  --line:#f5c9e5;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 8%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 85% 18%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 25% 70%,#fff 0 1.5px,transparent 2.5px),
    linear-gradient(145deg,#fff5fb 0%,#f9efff 48%,#eef8ff 100%);
  background-size:auto,auto,auto,100% 100%;
  min-height:100vh;
}
header{
  position:relative;
  overflow:hidden;
  padding:25px 16px 28px;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 30%,#ffffff88 0 2px,transparent 3px),
    radial-gradient(circle at 82% 22%,#ffffff99 0 3px,transparent 4px),
    radial-gradient(circle at 72% 78%,#ffffff77 0 2px,transparent 3px),
    linear-gradient(125deg,#ff6eae,#c67bea 55%,#73cfff);
  box-shadow:0 8px 28px #a96bb055;
}
header:before,header:after{
  content:"✦";
  position:absolute;
  color:#fff8a8;
  text-shadow:0 0 10px #fff;
  font-size:34px;
}
header:before{left:3%;top:22px;font-size:28px}
header:after{right:3%;bottom:18px;font-size:28px}
.logo{
  font-size:12px;
  letter-spacing:4px;
  font-weight:800;
  opacity:.95;
}
h1{
  margin:5px 0 0;
  font-size:clamp(20px,6vw,27px);
  letter-spacing:0;
  white-space:nowrap;
  text-shadow:0 2px 8px #7b397855;
}
h1:before{content:"♡ "}
h1:after{content:" ♡"}
.wrap{max-width:1000px;margin:auto;padding:15px}
.panel{
  background:#ffffffec;
  border:2px solid #fff;
  border-radius:22px;
  padding:14px;
  box-shadow:0 7px 25px #8d5da51b, inset 0 0 0 1px #f7d9ee;
  margin-bottom:14px;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,auto);
  gap:9px;
}
input,select,button{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 12px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  outline:none;
}
input::placeholder{color:#b99ab8}
input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff8dc522;
}
button{
  border:0;
  background:linear-gradient(135deg,#ff63aa,#a778ed);
  color:white;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 13px #c46cb744;
}
button:hover{filter:brightness(1.04)}
button.secondary{
  background:#fff7fc;
  color:#90658c;
  border:1px solid #efd5e9;
  box-shadow:none;
}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.stats{
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#a16e9a;
  margin:10px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.card{
  position:relative;
  background:linear-gradient(180deg,#fff,#fff8fd);
  border:2px solid #f2d4e9;
  border-radius:18px;
  padding:9px;
  box-shadow:0 5px 15px #9f7caa1c;
  min-width:0;
  transition:.2s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 22px #9f7caa30;
}
.card:before{
  content:"✦";
  position:absolute;
  top:5px;
  right:8px;
  color:#ffd15d;
  text-shadow:0 0 5px #fff;
  z-index:2;
}
.cardimg{
  aspect-ratio:2/3;
  border-radius:13px;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 75% 65%,#fff 0 2px,transparent 3px),
    linear-gradient(135deg,#ffdff0,#e8ddff 55%,#d9f6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#b58db1;
  font-size:12px;
  text-align:center;
  border:1px solid #f5d8ed;
}
.cardimg img{width:100%;height:100%;object-fit:cover}
/* 所持数0枚のカード画像だけを白黒にする（拡大画像はカラー） */
.card.unowned .cardimg img{filter:grayscale(100%)}
.name{
  font-weight:900;
  font-size:13px;
  margin:8px 2px 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#694d70;
}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff0f8,#f4efff);
  color:#9a6390;
}
.empty{
  text-align:center;
  padding:45px 15px;
  color:#a58da7;
}
footer{text-align:center;font-size:11px;color:#b49db5;padding:15px}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#4f3a5566;
 z-index:10;
 padding:20px;
 align-items:center;
 justify-content:center;
 backdrop-filter:blur(4px);
}
.modalbox{
 width:min(500px,100%);
 max-height:90vh;
 overflow:auto;
 background:linear-gradient(#fff,#fff8fd);
 border:2px solid white;
 border-radius:25px;
 padding:18px;
 box-shadow:0 15px 45px #54375b44;
}
.modal h2{margin-top:0;color:#815f87}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.close{background:#f8edf7;color:#866786;box-shadow:none;margin-top:8px}
@media(max-width:700px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:470px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .controls{grid-template-columns:1fr 1fr}
 .formgrid{grid-template-columns:1fr}
}

.edit-card-btn{
  margin-top:8px;
  min-height:40px;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  background:linear-gradient(135deg,#ff63aa,#a778ed);
}
.previewbox{
  width:min(430px,100%);
  background:linear-gradient(#fff,#fff8fd);
  border:2px solid #fff;
  border-radius:25px;
  padding:16px;
  box-shadow:0 15px 45px #54375b44;
  text-align:center;
}
.previewimg{
  width:min(430px,88vw);
  aspect-ratio:3/2;
  margin:0 auto 12px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(135deg,#ffdff0,#e8ddff 55%,#d9f6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a87da7;
  border:2px solid #f4d4ea;
}
/* カード拡大画面は上下にスワイプして全内容を閲覧できる */
#previewModal{
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  align-items:flex-start;
  justify-content:center;
  padding:12px 10px max(20px, env(safe-area-inset-bottom));
  box-sizing:border-box;
}
#previewModal .previewbox{
  flex:0 0 auto;
  max-width:100%;
  box-sizing:border-box;
  margin:auto 0;
}
#previewModal .previewimg{
  max-height:min(58dvh, 520px);
}
#previewModal .previewimg.accessory-preview{
  max-height:min(50dvh, 400px);
}
@media(max-height:650px){
  #previewModal .previewimg{max-height:45dvh;}
  #previewModal .previewimg.accessory-preview{max-height:40dvh;}
}
/* 通常カードは縦長、アクセサリーだけ横長の拡大表示 */
.previewimg{width:min(280px,68vw);aspect-ratio:2/3;}
.previewimg.accessory-preview{width:min(430px,88vw);aspect-ratio:3/2;}
/* 一覧画像はそのまま、拡大時のみ画像の縦横比に応じて表示する */
.previewimg img{
  width:100%;height:100%;object-fit:contain;flex-shrink:0;background:transparent;
  transform:none;
}
.previewimg img.preview-portrait-source{
  width:auto;height:auto;
  max-width:none;max-height:none;
  /* 縦長に保存された横向きカードを横長に表示 */
  width:calc(100% * 2 / 3);
  height:150%;
  transform:rotate(90deg);
}
.previewname{font-size:18px;font-weight:900;color:#694d70;margin:5px 0}
.previewmeta{font-size:13px;color:#987697;line-height:1.7}


.owned-row{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
  padding-top:7px;
  border-top:1px dashed #f0d4e7;
}
.owned-label{
  font-size:11px;
  font-weight:800;
  color:#9a7195;
  white-space:nowrap;
}
.owned-count-btn{
  width:100%;
  min-width:0;
  min-height:38px;
  padding:7px 9px;
  border-radius:11px;
  font-size:13px;
  font-weight:900;
  background:linear-gradient(135deg,#ff82bb,#a778ed);
  color:#fff;
  cursor:pointer;
}
.owned-count-btn.at-max{background:linear-gradient(135deg,#9b83b0,#77718f)}
.owned-input{
  min-width:0;
  height:38px;
  padding:6px 8px;
  text-align:center;
  font-weight:900;
  font-size:14px;
  border-radius:11px;
}
.preview-edit-btn{
  margin-top:12px;
  min-height:44px;
}


.image-label{display:block;margin-top:10px;font-size:13px;font-weight:800;color:#8d4d86}
.preview-image-switch{display:flex;gap:8px;justify-content:center;margin:10px 0}
.preview-image-switch button{border:1px solid #f1b9df;background:#fff;color:#8b4c83;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer}
.preview-image-switch button.active{background:#f7d8ef}

.detail-toggle{
  width:100%;border:1px solid #efb9df;background:#fff7fd;color:#87477e;
  border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;margin-top:10px
}
.detail-toggle .arrow{transition:transform .2s ease}
.detail-toggle.open .arrow{transform:rotate(180deg)}
.detail-search{display:none;margin-top:10px}
.detail-search.open{display:grid}
.sort-controls{margin-top:10px}

.cardimg{position:relative}
.card-favorite{
  position:absolute;top:7px;right:7px;z-index:3;
  width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(255,255,255,.9);color:#d28a00;
  font-size:24px;line-height:34px;text-align:center;
  box-shadow:0 2px 8px rgba(100,40,90,.18);cursor:pointer;
  padding:0
}
.card-favorite.active{color:#f0ad00}
.favorite-filter-check{
  min-height:42px;border:1px solid #efc4e3;background:#fff;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:#8b4c83;font-weight:800;cursor:pointer;padding:8px 6px;white-space:nowrap;font-size:14px
}
.favorite-filter-check input{width:18px;height:18px;accent-color:#d86cb8}

.add{
  display:block;width:100%;max-width:520px;margin:14px auto;
  border:0;border-radius:16px;padding:13px 16px;
  background:linear-gradient(135deg,#ef75bb,#9e7be8);
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 14px rgba(139,76,131,.18)
}

.modalbox{
  position:relative!important;
  overflow-y:auto!important;
  pointer-events:auto!important;
}
.modalbox::before,.modalbox::after{pointer-events:none!important}
.modal-actions,.preview-actions{
  position:relative!important;
  z-index:5!important;
  display:grid!important;
  grid-template-columns:1fr!important;
  gap:10px!important;
  width:100%!important;
  height:auto!important;
  margin:14px 0 0!important;
  padding:0!important;
  pointer-events:auto!important;
}
.modal-actions button,.preview-actions button{
  position:relative!important;
  inset:auto!important;
  float:none!important;
  display:block!important;
  width:100%!important;
  height:46px!important;
  min-height:46px!important;
  max-height:46px!important;
  margin:0!important;
  padding:0 14px!important;
  border:0!important;
  border-radius:12px!important;
  line-height:46px!important;
  font-size:15px!important;
  font-weight:900!important;
  box-sizing:border-box!important;
  z-index:6!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
}
.modal-save-btn,#previewEditBtn{
  background:linear-gradient(135deg,#ff8fc8,#9b83ea)!important;
  color:#fff!important;
}
.modal-delete-btn,#previewDeleteBtn{
  background:#e85b75!important;
  color:#fff!important;
}

/* 大サイズは3列で表示 */
.wrap{max-width:1200px;padding:9px 7px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{padding:4px;border-width:1px;border-radius:11px;box-shadow:0 2px 7px #9f7caa19}
.cardimg{border-radius:7px}
.card .name{font-size:clamp(9px,1.7vw,13px);margin:5px 1px 3px}
.card .tags{gap:2px}
.card .tag{font-size:clamp(8px,1.3vw,10px);padding:2px 4px}
.card .owned-row{margin-top:5px;padding-top:5px}
.card .owned-count-btn{min-height:30px;padding:5px 2px;border-radius:7px;font-size:clamp(10px,1.8vw,13px)}
.card .card-favorite{width:26px;height:26px;top:4px;right:4px;font-size:19px;line-height:26px}
@media(max-width:470px){
 .wrap{padding:8px 5px}
 .grid{gap:4px}
 .card{padding:3px;border-radius:9px}
 .cardimg{border-radius:5px}
 .card .card-favorite{width:23px;height:23px;font-size:17px;line-height:23px;top:3px;right:3px}
 .card .owned-count-btn{min-height:28px}
}

/* 一覧のカード情報：番号・キャラクター・衣装名・レアリティだけ */
.card .card-number{font-size:clamp(9px,1.5vw,12px);color:#8f8192;margin:6px 1px 4px;line-height:1.25}
.card .card-person-row{display:flex;align-items:center;gap:3px;min-width:0;margin:0 1px 5px}
.card .card-character{font-size:clamp(10px,1.7vw,14px);font-weight:850;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#59425f}
.card .card-rarity{font-size:clamp(8px,1.2vw,10px);font-weight:800;color:#d63386;background:#ffedf6;border-radius:999px;padding:3px 5px;flex-shrink:0}
.card .card-outfit{font-size:clamp(10px,1.6vw,13px);font-weight:800;color:#4e3e55;line-height:1.35;min-height:2.7em;margin:0 1px 5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
@media(max-width:470px){.card .card-number{margin-top:4px}.card .card-person-row{margin-bottom:4px}.card .card-outfit{margin-bottom:4px}}

/* 参考画像に合わせたコンパクトなカード一覧 */
.grid{gap:5px;align-items:start}
.card{padding:3px;border-radius:10px}
.cardimg{aspect-ratio: 0.71;border-radius:6px}
.card .card-number{margin:3px 1px 2px;line-height:1.1;font-size:clamp(9px,1.35vw,11px)}
.card .card-person-row{margin:0 1px 2px;gap:2px;min-height:0}
.card .card-character{font-size:clamp(9px,1.6vw,13px);line-height:1.15}
.card .card-rarity{font-size:clamp(8px,1.1vw,10px);padding:2px 4px;line-height:1.1}
.card .card-outfit{font-size:clamp(9px,1.45vw,12px);line-height:1.18;min-height:2.36em;margin:0 1px 3px;-webkit-line-clamp:2}
.card .owned-row{margin-top:2px;padding-top:3px;border-top:0}
.card .owned-count-btn{min-height:25px;padding:3px 2px;border-radius:6px;font-size:clamp(9px,1.45vw,12px);line-height:1.25}
@media(max-width:470px){.grid{gap:4px}.card{padding:2px}.card .card-number{margin-top:3px}.card .card-person-row{margin-bottom:2px}.card .card-outfit{margin-bottom:2px}.card .owned-count-btn{min-height:25px}}
/* カードサイズ切り替え：小は画像のみ6列 */
.card-size-control{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;font-weight:800;color:#8b4c83}
.card-size-control select{flex:1;min-width:0}
.grid.small-cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.grid.small-cards .card{padding:2px;border-radius:6px}
.grid.small-cards .cardimg{border-radius:4px}
.grid.small-cards .card-number,.grid.small-cards .card-person-row,.grid.small-cards .card-outfit,.grid.small-cards .owned-row,.grid.small-cards .card-favorite{display:none!important}
/* 大サイズは30枚ごとのページ切り替え */
.pagination{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0 8px}
.pagination button{width:auto;min-width:42px;padding:9px 12px;border-radius:11px}
.pagination button:disabled{opacity:.35;cursor:default}
.pagination button.current{background:#fff;color:#a44c91;border:2px solid #d777b5;box-shadow:none}
.pagination .page-label{font-size:13px;font-weight:800;color:#986d94;margin:0 4px}
.display-settings{display:none;margin-top:10px}
.display-settings.open{display:block}
.display-settings .sort-controls{margin-top:9px}
.sort-tap-controls{display:grid;gap:7px}
.sort-tap-title{font-size:13px;font-weight:900;color:#8b4c83}
.sort-tap-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sort-tap-btn{background:#fff7fc;color:#90658c;border:1px solid #efd5e9;box-shadow:none;border-radius:12px;padding:10px 5px;font-size:13px}
.sort-tap-btn{white-space:nowrap;word-break:keep-all;min-width:0;font-size:clamp(10px,3vw,13px);padding-left:2px;padding-right:2px}
.sort-tap-btn.active{background:linear-gradient(135deg,#ff63aa,#a778ed);color:#fff;border-color:transparent;box-shadow:0 3px 9px #c46cb744}
#sortBy[hidden]{display:none!important}
/* カードサイズをタップで選択 */
.card-size-tap-group{margin-top:12px}
.card-size-tap-title{font-size:13px;font-weight:800;color:#8b4c83;margin-bottom:7px}
.card-size-tap-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-size-tap-btn{background:#fff7fc;color:#8b4c83;border:1px solid #efc9e2;box-shadow:none;padding:10px}
.card-size-tap-btn.active{background:linear-gradient(135deg,#ff63aa,#a778ed);color:white;border-color:transparent}

/* 表示と絞り込みを横一列に配置 */
.settings-toggle-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}
.settings-toggle-row .detail-toggle{
  width:100%;
  min-width:0;
  margin-top:0;
  padding:10px 12px;
  font-size:14px;
}
</style>
<meta name="theme-color" content="#d96fbb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アイカツ！アンコール">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<header>
  <div class="logo">✦ Aikatsu Encore ✦</div>
  <h1>アイカツ！アンコール カード帳</h1>
</header>

<main class="wrap">
  <section class="panel">
    <input id="search" placeholder="🔍 カード名・カード番号・キャラクターを検索">

    <div class="settings-toggle-row">
    <button type="button" id="displayToggle" class="detail-toggle" aria-expanded="false" aria-controls="displaySettings">
      <span>表示</span><span class="arrow">⌄</span>
    </button>
    <div id="displaySettings" class="display-settings">
      <div class="controls sort-controls">
        <label class="favorite-filter-check">
          <input type="checkbox" id="favoriteFilter">
          <span>★ お気に入り</span>
        </label>
      </div>
      <div class="sort-tap-controls" aria-label="並び順">
        <div class="sort-tap-title">並び順</div>
        <div class="sort-tap-row" role="group" aria-label="並び替える項目">
          <button type="button" class="sort-tap-btn active" data-sort-field="cardNumber" aria-pressed="true">カード番号</button>
          <button type="button" class="sort-tap-btn" data-sort-field="rarity" aria-pressed="false">レアリティ</button>
        </div>
        <div class="sort-tap-row" role="group" aria-label="昇順・降順">
          <button type="button" class="sort-tap-btn active" data-sort-order="asc" aria-pressed="true">昇順</button>
          <button type="button" class="sort-tap-btn" data-sort-order="desc" aria-pressed="false">降順</button>
        </div>
        <select id="sortBy" aria-label="現在の並び順" hidden>
          <option value="cardNumber-asc">カード番号 昇順</option>
          <option value="cardNumber-desc">カード番号 降順</option>
          <option value="rarity-asc">レアリティ 昇順</option>
          <option value="rarity-desc">レアリティ 降順</option>
        </select>
      </div>
      <div class="card-size-tap-group">
        <div class="card-size-tap-title">カードサイズ</div>
        <div class="card-size-tap-buttons" role="group" aria-label="カードサイズ">
          <button type="button" class="card-size-tap-btn active" data-card-size="large" aria-pressed="true">大</button>
          <button type="button" class="card-size-tap-btn" data-card-size="small" aria-pressed="false">小</button>
        </div>
        <select id="cardSize" aria-label="現在のカードサイズ" hidden>
          <option value="large">大</option><option value="small">小</option>
        </select>
      </div>
    </div>

    <button type="button" id="detailToggle" class="detail-toggle" aria-expanded="false" aria-controls="detailSearch">
      <span>絞り込み</span><span class="arrow">⌄</span>
    </button>
    </div>
    <div id="detailSearch" class="controls detail-search">
      <select id="series"><option value="">弾数：すべて</option><option value="__promo__">プロモ</option></select>
      <select id="ownership"><option value="">所持状況：すべて</option><option value="owned">所持済み</option><option value="unowned">未所持</option></select>
      <select id="type"><option value="">タイプ：すべて</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
      <select id="brand"><option value="">ブランド：すべて</option></select>
      <select id="rarity"><option value="">レアリティ：すべて</option><option>N</option><option>R</option><option>PR</option><option>ER</option><option>パラレル</option></select>
      <select id="character"><option value="">キャラクター：すべて</option></select>
      <select id="category"><option value="">カテゴリ：すべて</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス&ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select>
    </div>

    <button class="reset" id="reset" type="button">絞り込みをリセット</button>
  </section>

  <div class="stats" id="stats"></div>
  
  <button class="add" id="addBtn" type="button" onclick="openModal()">＋ カードを追加</button>

<section id="grid" class="grid"></section>
  <nav id="pagination" class="pagination" aria-label="カードのページ切り替え"></nav>
  <footer>カード情報はこの端末のブラウザに保存されます ✦</footer>
</main>


<div class="modal" id="previewModal">
  <div class="previewbox">
    <div class="previewimg" id="previewImage"></div>
    <div class="preview-image-switch" id="previewImageSwitch">
      <button type="button" id="showFrontBtn" class="active">表面</button>
      <button type="button" id="showBackBtn">裏面</button>
    </div>
    <div class="previewname" id="previewName"></div>
    <div class="previewmeta" id="previewMeta"></div>
    <div class="preview-actions">
      <button id="previewEditBtn" type="button">編集</button>
      <button id="previewDeleteBtn" type="button">削除する</button>
    </div>
    <button class="close" id="previewClose">閉じる</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2 id="modalTitle">✦ カードを追加</h2>
    <div class="formgrid">
      <input id="fName" placeholder="カード名">
      <input id="fCharacter" placeholder="キャラクター">
      <select id="fType"><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
      <input id="fBrand" placeholder="ブランド">
      <select id="fRarity"><option>N</option><option>R</option><option>PR</option><option>ER</option><option>パラレル</option></select>
      <input id="fCardNumber" placeholder="カード番号（例：01-001）">
      <select id="fCategory"><option value="">カテゴリ：未設定</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス&ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select>
      <label class="image-label">表面の写真</label><input id="fImage" type="file" accept="image/*">
<label class="image-label">裏面の写真</label><input id="fBackImage" type="file" accept="image/*">
</div>
    <div class="actions">
      <div class="modal-actions">
      <button id="saveBtn" type="button" class="modal-save-btn">保存</button>
      <button id="deleteBtn" type="button" class="modal-delete-btn" style="display:none">削除する</button>
    </div>
    </div>
    <button class="close" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<script>

const KEY="aikatsuEncoreCards";
let cards=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingIndex=null;
let previewingIndex=null;
const $=id=>document.getElementById(id);

function uniq(key){return [...new Set(cards.map(c=>c[key]).filter(Boolean))].sort()}
function fillFilters(){
  [["series","弾数：すべて","series"],["brand","ブランド：すべて","brand"],["character","キャラクター：すべて","character"]].forEach(([id,first,key])=>{
    const el=$(id), old=el.value; el.innerHTML=`<option value="">${first}</option>`;
    if(id==="series") el.insertAdjacentHTML("beforeend",`<option value="__promo__">プロモ</option>`);
    const values=id==="series"
      ? [...new Set(cards.map(c=>getSeriesFromCardNumber(c.cardNumber)).filter(v=>v && v!=="プロモ"))].sort()
      : uniq(key);
    values.forEach(v=>el.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));
    el.value=old;
  });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}


function cardNumberSortKey(c){
  const raw=String(c.cardNumber||"").trim().toUpperCase();
  let group=9998;
  const normal=raw.match(/^E(\d+)/);
  if(normal) group=parseInt(normal[1],10);
  else if(raw.startsWith("EP")) group=9999;

  const tail=raw.replace(/^E(?:\d+|P)[-_ ]*/,"");
  const nums=tail.match(/\d+/g)||[];
  const numeric=nums.length?nums.map(n=>parseInt(n,10)):[999999];
  return {group,numeric,raw};
}
function compareCardNumber(a,b){
  const A=cardNumberSortKey(a), B=cardNumberSortKey(b);
  if(A.group!==B.group) return A.group-B.group;
  const len=Math.max(A.numeric.length,B.numeric.length);
  for(let i=0;i<len;i++){
    const av=A.numeric[i]??-1, bv=B.numeric[i]??-1;
    if(av!==bv) return av-bv;
  }
  return A.raw.localeCompare(B.raw,"ja",{numeric:true,sensitivity:"base"});
}
const rarityOrder=["N","R","PR","ER","パラレル"];
function compareRarity(a,b){
  const ai=rarityOrder.indexOf(a.rarity);
  const bi=rarityOrder.indexOf(b.rarity);
  const ar=ai<0?999:ai, br=bi<0?999:bi;
  if(ar!==br) return ar-br;
  return compareCardNumber(a,b);
}

const PAGE_SIZE=30;
let currentPage=1;

function render(){
  const q=$("search").value.toLowerCase();
  const fs={category:$("category").value,type:$("type").value,brand:$("brand").value,rarity:$("rarity").value,character:$("character").value};
  const seriesFilter=$("series").value;
  const ownership=$("ownership").value;
  let list=cards.map((c,i)=>({...c,_index:i})).filter(c=>
    (!q || [c.name,c.cardNumber,c.character,c.brand].join(" ").toLowerCase().includes(q)) &&
    (!seriesFilter || (seriesFilter==="__promo__" ? getSeriesFromCardNumber(c.cardNumber)==="プロモ" : getSeriesFromCardNumber(c.cardNumber)===seriesFilter)) &&
    (!ownership || (ownership==="owned" ? (Number(c.owned)||0)>0 : (Number(c.owned)||0)===0)) &&
    Object.entries(fs).every(([k,v])=>!v||c[k]===v)
  );
  const [sortBy,sortOrder]=$("sortBy").value.split("-");
  const favoriteFilter=$("favoriteFilter").checked;
  if(favoriteFilter) list=list.filter(c=>!!c.favorite);
  list.sort((a,b)=>{
    const result=sortBy==="rarity" ? compareRarity(a,b) : compareCardNumber(a,b);
    return sortOrder==="desc" ? -result : result;
  });
  const smallMode=$("cardSize").value==="small";
  $("grid").classList.toggle("small-cards",smallMode);
  const pageCount=smallMode?1:Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  currentPage=Math.min(Math.max(1,currentPage),pageCount);
  const pageList=smallMode?list:list.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  const ownedCards=cards.filter(c=>(Number(c.owned)||0)>0).length;
  const ownershipRate=cards.length ? (ownedCards/cards.length*100).toFixed(1) : "0.0";
  $("stats").textContent=`全 ${cards.length} 枚　／　所持数 ${ownedCards} 枚　／　所持率 ${ownershipRate}%`;
  $("pagination").innerHTML=!smallMode&&pageCount>1?`
    <button type="button" onclick="changePage(${currentPage-1})" ${currentPage===1?"disabled":""}>前へ</button>
    <span class="page-label">${currentPage} / ${pageCount}</span>
    <button type="button" onclick="changePage(${currentPage+1})" ${currentPage===pageCount?"disabled":""}>次へ</button>`:"";
  $("grid").innerHTML=list.length?pageList.map(c=>`
    <article class="card ${(Number(c.owned)||0)===0 && ownership!=="unowned"?"unowned":""}" onclick="previewCard(${c._index})" title="タップして拡大">
      <div class="cardimg">
      <button type="button" class="card-favorite ${c.favorite?"active":""}" onclick="event.stopPropagation();toggleFavorite(${c._index})" aria-label="お気に入り">${c.favorite?"★":"☆"}</button>${c.image?`<img src="${c.image}">`:"✦ カード画像 ✦"}</div>
      <div class="card-number">${esc(c.cardNumber||"番号未設定")}</div>
      <div class="card-person-row"><span class="card-character" title="${esc(c.character||"キャラ未設定")}">${esc(c.character||"キャラ未設定")}</span><span class="card-rarity">${esc(c.rarity||"-")}</span></div>
      <div class="card-outfit" title="${esc(c.name||"衣装名未設定")}">${esc(c.name||"衣装名未設定")}</div>
      <div class="owned-row" onclick="event.stopPropagation()">
        <button type="button" class="owned-count-btn ${Math.min(3,Math.max(0,Number(c.owned)||0))===3?"at-max":""}" onclick="event.preventDefault();event.stopPropagation();incrementOwned(${c._index});return false;" aria-label="所持数を変更。3枚の次は未所持">${Math.min(3,Math.max(0,Number(c.owned)||0))===0?"未所持":`${Math.min(3,Math.max(0,Number(c.owned)||0))}枚`}</button>
      </div>
    </article>`).join(""):`<div class="panel empty" style="grid-column:1/-1">まだカードがありません ✦<br>「＋ カードを追加」から登録してね！</div>`;
}


function changePage(page){
  currentPage=page;
  render();
  $("grid").scrollIntoView({behavior:"smooth",block:"start"});
}

let previewSide="front";
function setPreviewSide(side){
  if(previewingIndex===null)return;
  const c=cards[previewingIndex];
  previewSide=side;
  const img=side==="back"?c.backImage:c.image;
  const container=$("previewImage");
  const isAccessory=(c.category||"").trim()==="アクセサリー";
  container.classList.toggle("accessory-preview",isAccessory);
  container.innerHTML=img ? `<img src="${img}" alt="${esc(c.name||"カード")}">` : "✦ 画像なし ✦";
  if(img){
    const previewImg=container.querySelector("img");
    previewImg.onload=()=>{
      // アクセサリーのみ、縦長画像を拡大時に横向きにする。
      previewImg.classList.toggle("preview-portrait-source",isAccessory && previewImg.naturalHeight>previewImg.naturalWidth);
    };
  }
  $("showFrontBtn").classList.toggle("active",side==="front");
  $("showBackBtn").classList.toggle("active",side==="back");
}

function previewCard(index){
  previewingIndex=index;
  previewSide="front";
  const c=cards[index];
  $("showFrontBtn").style.display="inline-block";
  $("showBackBtn").style.display="inline-block";
  setPreviewSide(c.image?"front":(c.backImage?"back":"front"));
  $("previewName").textContent=c.name||"名前なし";
  // 拡大画面では、一覧で省略した情報もすべて表示する。
  $("previewMeta").innerHTML=[
    `カード番号：${esc(c.cardNumber||"未設定")}`,
    `キャラクター名：${esc(c.character||"未設定")}`,
    `衣装名：${esc(c.name||"未設定")}`,
    `弾数：${esc(getSeriesFromCardNumber(c.cardNumber)||"未設定")}`,
    `タイプ：${esc(c.type||"未設定")}`,
    `ブランド：${esc(c.brand||"未設定")}`,
    `カテゴリ：${esc(c.category||"未設定")}`,
    `レアリティ：${esc(c.rarity||"未設定")}`
  ].join("<br>");
  $("previewModal").style.display="flex";
}
function closePreview(){
  $("previewModal").style.display="none";
  previewingIndex=null;
}



function toggleFavorite(index){
  cards[index].favorite=!cards[index].favorite;
  localStorage.setItem("aikatsuEncoreCards",JSON.stringify(cards));
  render();
}

// カードの親要素より先にクリックを処理し、拡大表示を防ぐ
function incrementOwned(index){
  if(!Number.isInteger(index) || !cards[index]) return;
  const current=Math.min(3,Math.max(0,Math.floor(Number(cards[index].owned)||0)));
  cards[index].owned=current>=3?0:current+1;
  localStorage.setItem(KEY,JSON.stringify(cards));
  render();
}

function updateOwned(index,value){
  let n=parseInt(value,10);
  if(!Number.isFinite(n) || n<0) n=0;
  cards[index].owned=n;
  localStorage.setItem(KEY,JSON.stringify(cards));
  render();
}


function getSeriesFromCardNumber(cardNumber){
  const num=String(cardNumber||"").trim().toUpperCase();
  if(num.startsWith("EP")) return "プロモ";
  if(num.startsWith("E1")) return "1弾";
  if(num.startsWith("E2")) return "2弾";
  return "";
}

function clearForm(){
  $("fName").value="";
  $("fCharacter").value="";
  $("fType").value="キュート";
  $("fBrand").value="";
  $("fRarity").value="N";
  $("fCardNumber").value="";
  $("fCategory").value="";
  $("fImage").value="";
  $("fBackImage").value="";
}

function openModal(){
  editingIndex=null;
  clearForm();
  $("modalTitle").textContent="✦ カードを追加";
  $("saveBtn").textContent="保存する";
  $("deleteBtn").style.display="none";
  $("modal").style.display="flex";
}

function editCard(index){
  editingIndex=index;
  const c=cards[index];
  $("fName").value=c.name||"";
  $("fCharacter").value=c.character||"";
  $("fType").value=["キュート","クール","セクシー","ポップ"].includes(c.type)?c.type:"キュート";
  $("fBrand").value=c.brand||"";
  $("fRarity").value=["N","R","PR","ER","パラレル"].includes(c.rarity)?c.rarity:"N";
  $("fCardNumber").value=c.cardNumber||"";
  $("fCategory").value=c.category||"";
  $("fImage").value="";
  $("fBackImage").value="";
  $("modalTitle").textContent="✦ カードを編集";
  $("saveBtn").textContent="変更を保存";
  $("deleteBtn").style.display="block";
  $("modal").style.display="flex";
}

function closeModal(){
  $("modal").style.display="none";
  editingIndex=null;
}

function fileAsDataURL(file){
  return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error("画像を読み込めませんでした"));reader.readAsDataURL(file);});
}
let savingCard=false;
async function saveCard(){
  if(savingCard)return;
  savingCard=true;
  $("saveBtn").disabled=true;
  const old=editingIndex!==null?cards[editingIndex]:null;
  const base={
    name:$("fName").value.trim(),character:$("fCharacter").value.trim(),
    series:getSeriesFromCardNumber($("fCardNumber").value),type:$("fType").value,
    brand:$("fBrand").value.trim(),rarity:$("fRarity").value,category:$("fCategory").value,
    cardNumber:$("fCardNumber").value.trim(),
    owned:old?(Number(old.owned)||0):0,image:old?.image||"",backImage:old?.backImage||"",
    favorite:old?.favorite||false
  };
  try{
    const frontFile=$("fImage").files[0],backFile=$("fBackImage").files[0];
    if(frontFile)base.image=await fileAsDataURL(frontFile);
    if(backFile)base.backImage=await fileAsDataURL(backFile);
    if(editingIndex!==null)cards[editingIndex]=base;else cards.push(base);
    localStorage.setItem(KEY,JSON.stringify(cards));
    fillFilters();render();closeModal();
  }catch(error){alert("保存できませんでした："+error.message);}
  finally{savingCard=false;$("saveBtn").disabled=false;}
}

function clearFilters(){
  ["search","series","ownership","type","brand","rarity","character","category"].forEach(id=>$(id).value="");
  $("sortBy").value="cardNumber-asc";
  syncSortTapButtons();
  $("favoriteFilter").checked=false;
  $("cardSize").value="large";
  syncCardSizeButtons();
  currentPage=1;
  render();
}

function syncSortTapButtons(){
  const [field,order]=$("sortBy").value.split("-");
  document.querySelectorAll("[data-sort-field]").forEach(btn=>{
    const active=btn.dataset.sortField===field;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",String(active));
  });
  document.querySelectorAll("[data-sort-order]").forEach(btn=>{
    const active=btn.dataset.sortOrder===order;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",String(active));
  });
}
document.querySelectorAll("[data-sort-field],[data-sort-order]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    let [field,order]=$("sortBy").value.split("-");
    if(btn.dataset.sortField)field=btn.dataset.sortField;
    if(btn.dataset.sortOrder)order=btn.dataset.sortOrder;
    $("sortBy").value=field+"-"+order;
    syncSortTapButtons();
    currentPage=1;
    render();
  });
});
syncSortTapButtons();
function syncCardSizeButtons(){
  const selected=$("cardSize").value;
  document.querySelectorAll("[data-card-size]").forEach(btn=>{
    const active=btn.dataset.cardSize===selected;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",String(active));
  });
}
document.querySelectorAll("[data-card-size]").forEach(btn=>btn.addEventListener("click",()=>{
  $("cardSize").value=btn.dataset.cardSize;
  syncCardSizeButtons();
  currentPage=1;
  render();
}));
syncCardSizeButtons();

$("displayToggle").addEventListener("click",()=>{
  const open=$("displaySettings").classList.toggle("open");
  $("displayToggle").classList.toggle("open",open);
  $("displayToggle").setAttribute("aria-expanded",String(open));
});

$("detailToggle").addEventListener("click",()=>{
  const open=$("detailSearch").classList.toggle("open");
  $("detailToggle").classList.toggle("open",open);
  $("detailToggle").setAttribute("aria-expanded",String(open));
});

["search","series","ownership","type","brand","rarity","character","category","sortBy","favoriteFilter","cardSize"].forEach(id=>$(id).addEventListener("input",()=>{currentPage=1;render();}));
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("previewClose").addEventListener("click",closePreview);
$("previewEditBtn").addEventListener("click",()=>{const i=previewingIndex;if(i===null)return;$("previewModal").style.display="none";previewingIndex=null;editCard(i);});
$("previewModal").addEventListener("click",e=>{if(e.target===$("previewModal"))closePreview()});

$("showFrontBtn").addEventListener("click",()=>setPreviewSide("front"));
$("showBackBtn").addEventListener("click",()=>setPreviewSide("back"));
$("saveBtn").addEventListener("click",saveCard);
fillFilters();
render();



let deleteConfirmMode="";

function resetDeleteButtons(){
  deleteConfirmMode="";
  if($("deleteBtn")) $("deleteBtn").textContent="削除する";
  if($("previewDeleteBtn")) $("previewDeleteBtn").textContent="削除する";
}

function deleteUsingRealIndex(source,e){
  if(e){e.preventDefault();e.stopPropagation();}

  const btn=source==="preview" ? $("previewDeleteBtn") : $("deleteBtn");
  const index=source==="preview" ? previewingIndex : editingIndex;

  if(index===null || !Number.isInteger(Number(index)) || Number(index)<0 || Number(index)>=cards.length){
    btn.textContent="削除対象を取得できません";
    return false;
  }

  if(deleteConfirmMode!==source){
    resetDeleteButtons();
    deleteConfirmMode=source;
    btn.textContent="もう一度押すと削除";
    return false;
  }

  const i=Number(index);
  cards.splice(i,1);
  localStorage.setItem("aikatsuEncoreCards",JSON.stringify(cards));

  editingIndex=null;
  previewingIndex=null;
  resetDeleteButtons();
  $("modal").style.display="none";
  $("previewModal").style.display="none";
  fillFilters();
  render();
  return false;
}

$("previewDeleteBtn").onclick=function(e){return deleteUsingRealIndex("preview",e);};
$("deleteBtn").onclick=function(e){return deleteUsingRealIndex("edit",e);};

if("serviceWorker" in navigator && location.protocol!=="file:"){
window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
