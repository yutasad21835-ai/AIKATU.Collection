<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイカツ！アンコール カード帳</title>
<style>
:root{
  --pink:#ff62ad;
  --hot:#ff3f93;
  --lav:#9b75ef;
  --sky:#77d9ff;
  --gold:#ffd76b;
  --cream:#fffaff;
  --text:#5b4866;
  --line:#f5c9e5;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 8%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 85% 18%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 25% 70%,#fff 0 1.5px,transparent 2.5px),
    linear-gradient(145deg,#fff5fb 0%,#f9efff 48%,#eef8ff 100%);
  background-size:auto,auto,auto,100% 100%;
  min-height:100vh;
}
header{
  position:relative;
  overflow:hidden;
  padding:25px 16px 28px;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 30%,#ffffff88 0 2px,transparent 3px),
    radial-gradient(circle at 82% 22%,#ffffff99 0 3px,transparent 4px),
    radial-gradient(circle at 72% 78%,#ffffff77 0 2px,transparent 3px),
    linear-gradient(125deg,#ff6eae,#c67bea 55%,#73cfff);
  box-shadow:0 8px 28px #a96bb055;
}
header:before,header:after{
  content:"✦";
  position:absolute;
  color:#fff8a8;
  text-shadow:0 0 10px #fff;
  font-size:34px;
}
header:before{left:3%;top:22px;font-size:28px}
header:after{right:3%;bottom:18px;font-size:28px}
.logo{
  font-size:12px;
  letter-spacing:4px;
  font-weight:800;
  opacity:.95;
}
h1{
  margin:5px 0 0;
  font-size:clamp(20px,6vw,27px);
  letter-spacing:0;
  white-space:nowrap;
  text-shadow:0 2px 8px #7b397855;
}
h1:before{content:"♡ "}
h1:after{content:" ♡"}
.wrap{max-width:1000px;margin:auto;padding:15px}
.panel{
  background:#ffffffec;
  border:2px solid #fff;
  border-radius:22px;
  padding:14px;
  box-shadow:0 7px 25px #8d5da51b, inset 0 0 0 1px #f7d9ee;
  margin-bottom:14px;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,auto);
  gap:9px;
}
input,select,button{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 12px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  outline:none;
}
input::placeholder{color:#b99ab8}
input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff8dc522;
}
button{
  border:0;
  background:linear-gradient(135deg,#ff63aa,#a778ed);
  color:white;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 13px #c46cb744;
}
button:hover{filter:brightness(1.04)}
button.secondary{
  background:#fff7fc;
  color:#90658c;
  border:1px solid #efd5e9;
  box-shadow:none;
}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.stats{
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#a16e9a;
  margin:10px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.card{
  position:relative;
  background:linear-gradient(180deg,#fff,#fff8fd);
  border:2px solid #f2d4e9;
  border-radius:18px;
  padding:9px;
  box-shadow:0 5px 15px #9f7caa1c;
  min-width:0;
  transition:.2s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 22px #9f7caa30;
}
.card:before{
  content:"✦";
  position:absolute;
  top:5px;
  right:8px;
  color:#ffd15d;
  text-shadow:0 0 5px #fff;
  z-index:2;
}
.cardimg{
  aspect-ratio:2/3;
  border-radius:13px;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 75% 65%,#fff 0 2px,transparent 3px),
    linear-gradient(135deg,#ffdff0,#e8ddff 55%,#d9f6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#b58db1;
  font-size:12px;
  text-align:center;
  border:1px solid #f5d8ed;
}
.cardimg img{width:100%;height:100%;object-fit:cover}
.name{
  font-weight:900;
  font-size:13px;
  margin:8px 2px 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#694d70;
}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff0f8,#f4efff);
  color:#9a6390;
}
.empty{
  text-align:center;
  padding:45px 15px;
  color:#a58da7;
}
footer{text-align:center;font-size:11px;color:#b49db5;padding:15px}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#4f3a5566;
 z-index:10;
 padding:20px;
 align-items:center;
 justify-content:center;
 backdrop-filter:blur(4px);
}
.modalbox{
 width:min(500px,100%);
 max-height:90vh;
 overflow:auto;
 background:linear-gradient(#fff,#fff8fd);
 border:2px solid white;
 border-radius:25px;
 padding:18px;
 box-shadow:0 15px 45px #54375b44;
}
.modal h2{margin-top:0;color:#815f87}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.close{background:#f8edf7;color:#866786;box-shadow:none;margin-top:8px}
@media(max-width:700px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:470px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .controls{grid-template-columns:1fr 1fr}
 .formgrid{grid-template-columns:1fr}
}

.edit-card-btn{
  margin-top:8px;
  min-height:40px;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  background:linear-gradient(135deg,#ff63aa,#a778ed);
}
.previewbox{
  width:min(430px,100%);
  background:linear-gradient(#fff,#fff8fd);
  border:2px solid #fff;
  border-radius:25px;
  padding:16px;
  box-shadow:0 15px 45px #54375b44;
  text-align:center;
}
.previewimg{
  width:min(300px,82vw);
  aspect-ratio:2/3;
  margin:0 auto 12px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(135deg,#ffdff0,#e8ddff 55%,#d9f6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a87da7;
  border:2px solid #f4d4ea;
}
.previewimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.previewname{font-size:18px;font-weight:900;color:#694d70;margin:5px 0}
.previewmeta{font-size:13px;color:#987697;line-height:1.7}


.owned-row{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
  padding-top:7px;
  border-top:1px dashed #f0d4e7;
}
.owned-label{
  font-size:11px;
  font-weight:800;
  color:#9a7195;
  white-space:nowrap;
}
.owned-input{
  min-width:0;
  height:38px;
  padding:6px 8px;
  text-align:center;
  font-weight:900;
  font-size:14px;
  border-radius:11px;
}
.preview-edit-btn{
  margin-top:12px;
  min-height:44px;
}


.image-label{display:block;margin-top:10px;font-size:13px;font-weight:800;color:#8d4d86}
.preview-image-switch{display:flex;gap:8px;justify-content:center;margin:10px 0}
.preview-image-switch button{border:1px solid #f1b9df;background:#fff;color:#8b4c83;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer}
.preview-image-switch button.active{background:#f7d8ef}

.detail-toggle{
  width:100%;border:1px solid #efb9df;background:#fff7fd;color:#87477e;
  border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;margin-top:10px
}
.detail-toggle .arrow{transition:transform .2s ease}
.detail-toggle.open .arrow{transform:rotate(180deg)}
.detail-search{display:none;margin-top:10px}
.detail-search.open{display:grid}
.sort-controls{margin-top:10px}

.cardimg{position:relative}
.card-favorite{
  position:absolute;top:7px;right:7px;z-index:3;
  width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(255,255,255,.9);color:#d28a00;
  font-size:24px;line-height:34px;text-align:center;
  box-shadow:0 2px 8px rgba(100,40,90,.18);cursor:pointer;
  padding:0
}
.card-favorite.active{color:#f0ad00}
.favorite-filter-check{
  min-height:42px;border:1px solid #efc4e3;background:#fff;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:#8b4c83;font-weight:800;cursor:pointer;padding:8px 6px;white-space:nowrap;font-size:14px
}
.favorite-filter-check input{width:18px;height:18px;accent-color:#d86cb8}

.add{
  display:block;width:100%;max-width:520px;margin:14px auto;
  border:0;border-radius:16px;padding:13px 16px;
  background:linear-gradient(135deg,#ef75bb,#9e7be8);
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 14px rgba(139,76,131,.18)
}

.modalbox{
  position:relative!important;
  overflow-y:auto!important;
  pointer-events:auto!important;
}
.modalbox::before,.modalbox::after{pointer-events:none!important}
.modal-actions,.preview-actions{
  position:relative!important;
  z-index:5!important;
  display:grid!important;
  grid-template-columns:1fr!important;
  gap:10px!important;
  width:100%!important;
  height:auto!important;
  margin:14px 0 0!important;
  padding:0!important;
  pointer-events:auto!important;
}
.modal-actions button,.preview-actions button{
  position:relative!important;
  inset:auto!important;
  float:none!important;
  display:block!important;
  width:100%!important;
  height:46px!important;
  min-height:46px!important;
  max-height:46px!important;
  margin:0!important;
  padding:0 14px!important;
  border:0!important;
  border-radius:12px!important;
  line-height:46px!important;
  font-size:15px!important;
  font-weight:900!important;
  box-sizing:border-box!important;
  z-index:6!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
}
.modal-save-btn,#previewEditBtn{
  background:linear-gradient(135deg,#ff8fc8,#9b83ea)!important;
  color:#fff!important;
}
.modal-delete-btn,#previewDeleteBtn{
  background:#e85b75!important;
  color:#fff!important;
}

</style>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header>
  <div class="logo">✦ Aikatsu Encore ✦</div>
  <h1>アイカツ！アンコール カード帳</h1>
</header>

<main class="wrap">
  <section class="panel">
    <input id="search" placeholder="🔍 カード名・カード番号・キャラクターを検索">

    <div class="controls sort-controls">
      <select id="sortBy">
        <option value="cardNumber-asc">並び順：カード番号 昇順</option>
        <option value="cardNumber-desc">カード番号 降順</option>
        <option value="rarity-asc">レアリティ 昇順</option>
        <option value="rarity-desc">レアリティ 降順</option>
      </select>
      <label class="favorite-filter-check">
        <input type="checkbox" id="favoriteFilter">
        <span>★ お気に入り</span>
      </label>
    </div>

    <button type="button" id="detailToggle" class="detail-toggle">
      <span>くわしくさがす</span><span class="arrow">⌄</span>
    </button>

    <div id="detailSearch" class="controls detail-search">
      <select id="series"><option value="">弾数：すべて</option><option value="__promo__">プロモ</option></select>
      <select id="ownership"><option value="">所持状況：すべて</option><option value="owned">所持済み</option><option value="unowned">未所持</option></select>
      <select id="type"><option value="">タイプ：すべて</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
      <select id="brand"><option value="">ブランド：すべて</option></select>
      <select id="rarity"><option value="">レアリティ：すべて</option><option>N</option><option>R</option><option>PR</option><option>ER</option><option>パラレル</option></select>
      <select id="character"><option value="">キャラクター：すべて</option></select>
    </div>

    <button class="reset" id="reset" type="button">絞り込みをリセット</button>
  </section>

  <div class="stats" id="stats"></div>
  
  <button class="add" id="addBtn" type="button" onclick="openModal()">＋ カードを追加</button>

<section id="grid" class="grid"></section>
  <footer>カード情報はこの端末のブラウザに保存されます ✦</footer>
</main>


<div class="modal" id="previewModal">
  <div class="previewbox">
    <div class="previewimg" id="previewImage"></div>
    <div class="preview-image-switch" id="previewImageSwitch">
      <button type="button" id="showFrontBtn" class="active">表面</button>
      <button type="button" id="showBackBtn">裏面</button>
    </div>
    <div class="previewname" id="previewName"></div>
    <div class="previewmeta" id="previewMeta"></div>
    <div class="preview-actions">
      <button id="previewEditBtn" type="button">編集</button>
      <button id="previewDeleteBtn" type="button">削除する</button>
    </div>
    <button class="close" id="previewClose">閉じる</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2 id="modalTitle">✦ カードを追加</h2>
    <div class="formgrid">
      <input id="fName" placeholder="カード名">
      <input id="fCharacter" placeholder="キャラクター">
      <select id="fType"><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
      <input id="fBrand" placeholder="ブランド">
      <select id="fRarity"><option>N</option><option>R</option><option>PR</option><option>ER</option><option>パラレル</option></select>
      <input id="fCardNumber" placeholder="カード番号（例：01-001）">
      <label class="image-label">表面の写真</label><input id="fImage" type="file" accept="image/*">
<label class="image-label">裏面の写真</label><input id="fBackImage" type="file" accept="image/*">
    </div>
    <div class="actions">
      <div class="modal-actions">
      <button id="saveBtn" type="button" class="modal-save-btn">保存</button>
      <button id="deleteBtn" type="button" class="modal-delete-btn" style="display:none">削除する</button>
    </div>
    </div>
    <button class="close" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<script>

const KEY="aikatsuEncoreCards";
let cards=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingIndex=null;
let previewingIndex=null;
const $=id=>document.getElementById(id);

function uniq(key){return [...new Set(cards.map(c=>c[key]).filter(Boolean))].sort()}
function fillFilters(){
  [["series","弾数：すべて","series"],["brand","ブランド：すべて","brand"],["character","キャラクター：すべて","character"]].forEach(([id,first,key])=>{
    const el=$(id), old=el.value; el.innerHTML=`<option value="">${first}</option>`;
    if(id==="series") el.insertAdjacentHTML("beforeend",`<option value="__promo__">プロモ</option>`);
    const values=id==="series"
      ? [...new Set(cards.map(c=>getSeriesFromCardNumber(c.cardNumber)).filter(v=>v && v!=="プロモ"))].sort()
      : uniq(key);
    values.forEach(v=>el.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));
    el.value=old;
  });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}


function cardNumberSortKey(c){
  const raw=String(c.cardNumber||"").trim().toUpperCase();
  let group=9998;
  const normal=raw.match(/^E(\d+)/);
  if(normal) group=parseInt(normal[1],10);
  else if(raw.startsWith("EP")) group=9999;

  const tail=raw.replace(/^E(?:\d+|P)[-_ ]*/,"");
  const nums=tail.match(/\d+/g)||[];
  const numeric=nums.length?nums.map(n=>parseInt(n,10)):[999999];
  return {group,numeric,raw};
}
function compareCardNumber(a,b){
  const A=cardNumberSortKey(a), B=cardNumberSortKey(b);
  if(A.group!==B.group) return A.group-B.group;
  const len=Math.max(A.numeric.length,B.numeric.length);
  for(let i=0;i<len;i++){
    const av=A.numeric[i]??-1, bv=B.numeric[i]??-1;
    if(av!==bv) return av-bv;
  }
  return A.raw.localeCompare(B.raw,"ja",{numeric:true,sensitivity:"base"});
}
const rarityOrder=["N","R","PR","ER","パラレル"];
function compareRarity(a,b){
  const ai=rarityOrder.indexOf(a.rarity);
  const bi=rarityOrder.indexOf(b.rarity);
  const ar=ai<0?999:ai, br=bi<0?999:bi;
  if(ar!==br) return ar-br;
  return compareCardNumber(a,b);
}

function render(){
  const q=$("search").value.toLowerCase();
  const fs={type:$("type").value,brand:$("brand").value,rarity:$("rarity").value,character:$("character").value};
  const seriesFilter=$("series").value;
  const ownership=$("ownership").value;
  let list=cards.map((c,i)=>({...c,_index:i})).filter(c=>
    (!q || [c.name,c.cardNumber,c.character,c.brand].join(" ").toLowerCase().includes(q)) &&
    (!seriesFilter || (seriesFilter==="__promo__" ? getSeriesFromCardNumber(c.cardNumber)==="プロモ" : getSeriesFromCardNumber(c.cardNumber)===seriesFilter)) &&
    (!ownership || (ownership==="owned" ? (Number(c.owned)||0)>0 : (Number(c.owned)||0)===0)) &&
    Object.entries(fs).every(([k,v])=>!v||c[k]===v)
  );
  const [sortBy,sortOrder]=$("sortBy").value.split("-");
  const favoriteFilter=$("favoriteFilter").checked;
  if(favoriteFilter) list=list.filter(c=>!!c.favorite);
  list.sort((a,b)=>{
    const result=sortBy==="rarity" ? compareRarity(a,b) : compareCardNumber(a,b);
    return sortOrder==="desc" ? -result : result;
  });
  $("stats").textContent=`全 ${cards.length} 枚　／　表示 ${list.length} 枚`;
  $("grid").innerHTML=list.length?list.map(c=>`
    <article class="card" onclick="previewCard(${c._index})" title="タップして拡大">
      <div class="cardimg">
      <button type="button" class="card-favorite ${c.favorite?"active":""}" onclick="event.stopPropagation();toggleFavorite(${c._index})" aria-label="お気に入り">${c.favorite?"★":"☆"}</button>${c.image?`<img src="${c.image}">`:"✦ カード画像 ✦"}</div>
      <div class="name" title="${esc(c.name)}">${esc(c.name||"名前なし")}</div>
      <div class="tags"><span class="tag">${esc(c.character||"キャラ未設定")}</span><span class="tag">${esc(c.rarity||"")}</span></div>
      <div class="tags"><span class="tag">${esc(c.brand||"ブランド未設定")}</span><span class="tag">${esc(c.type||"")}</span></div>
      <div class="owned-row" onclick="event.stopPropagation()">
        <span class="owned-label">所持数</span>
        <input class="owned-input" type="number" inputmode="numeric" min="0" step="1" value="${Number.isFinite(Number(c.owned))?Math.max(0,Math.floor(Number(c.owned))):1}" onchange="updateOwned(${c._index},this.value)" aria-label="所持数">
      </div>
    </article>`).join(""):`<div class="panel empty" style="grid-column:1/-1">まだカードがありません ✦<br>「＋ カードを追加」から登録してね！</div>`;
}



let previewSide="front";
function setPreviewSide(side){
  if(previewingIndex===null)return;
  const c=cards[previewingIndex];
  previewSide=side;
  const img=side==="back"?c.backImage:c.image;
  $("previewImage").innerHTML=img
    ? `<img src="${img}" alt="${esc(c.name||"カード")}">`
    : "✦ 画像なし ✦";
  $("showFrontBtn").classList.toggle("active",side==="front");
  $("showBackBtn").classList.toggle("active",side==="back");
}

function previewCard(index){
  previewingIndex=index;
  previewSide="front";
  const c=cards[index];
  $("showFrontBtn").style.display="inline-block";
  $("showBackBtn").style.display="inline-block";
  setPreviewSide(c.image?"front":(c.backImage?"back":"front"));
  $("previewName").textContent=c.name||"名前なし";
  $("previewMeta").innerHTML=[
    c.cardNumber?`カード番号：${esc(c.cardNumber)}`:"",
    c.character?`キャラクター：${esc(c.character)}`:"",
    getSeriesFromCardNumber(c.cardNumber)?`弾数：${esc(getSeriesFromCardNumber(c.cardNumber))}`:"",
    c.type?`タイプ：${esc(c.type)}`:"",
    c.brand?`ブランド：${esc(c.brand)}`:"",
    `所持数：${Number.isFinite(Number(c.owned))?Math.max(0,Math.floor(Number(c.owned))):1}`,
    c.rarity?`レアリティ：${esc(c.rarity)}`:""
  ].filter(Boolean).join("<br>");
  $("previewModal").style.display="flex";
}
function closePreview(){
  $("previewModal").style.display="none";
  previewingIndex=null;
}



function toggleFavorite(index){
  cards[index].favorite=!cards[index].favorite;
  localStorage.setItem("aikatsuEncoreCards",JSON.stringify(cards));
  render();
}

function updateOwned(index,value){
  let n=parseInt(value,10);
  if(!Number.isFinite(n) || n<0) n=0;
  cards[index].owned=n;
  localStorage.setItem(KEY,JSON.stringify(cards));
  render();
}


function getSeriesFromCardNumber(cardNumber){
  const num=String(cardNumber||"").trim().toUpperCase();
  if(num.startsWith("EP")) return "プロモ";
  if(num.startsWith("E1")) return "1弾";
  if(num.startsWith("E2")) return "2弾";
  return "";
}

function clearForm(){
  $("fName").value="";
  $("fCharacter").value="";
  $("fType").value="キュート";
  $("fBrand").value="";
  $("fRarity").value="N";
  $("fCardNumber").value="";
  $("fImage").value="";
  $("fBackImage").value="";
}

function openModal(){
  editingIndex=null;
  clearForm();
  $("modalTitle").textContent="✦ カードを追加";
  $("saveBtn").textContent="保存する";
  $("deleteBtn").style.display="none";
  $("modal").style.display="flex";
}

function editCard(index){
  editingIndex=index;
  const c=cards[index];
  $("fName").value=c.name||"";
  $("fCharacter").value=c.character||"";
  $("fType").value=["キュート","クール","セクシー","ポップ"].includes(c.type)?c.type:"キュート";
  $("fBrand").value=c.brand||"";
  $("fRarity").value=["N","R","PR","ER","パラレル"].includes(c.rarity)?c.rarity:"N";
  $("fCardNumber").value=c.cardNumber||"";
  $("fImage").value="";
  $("fBackImage").value="";
  $("modalTitle").textContent="✦ カードを編集";
  $("saveBtn").textContent="変更を保存";
  $("deleteBtn").style.display="block";
  $("modal").style.display="flex";
}

function closeModal(){
  $("modal").style.display="none";
  editingIndex=null;
}

function saveCard(){
  const frontFile=$("fImage").files[0];
  const backFile=$("fBackImage").files[0];
  const old=editingIndex!==null?cards[editingIndex]:null;
  const base={
    name:$("fName").value.trim(),
    character:$("fCharacter").value.trim(),
    series:getSeriesFromCardNumber($("fCardNumber").value),
    type:$("fType").value,
    brand:$("fBrand").value.trim(),
    rarity:$("fRarity").value,
    cardNumber:$("fCardNumber").value.trim(),
    owned:old ? (Number.isFinite(Number(old.owned)) ? Math.max(0,Math.floor(Number(old.owned))) : 0) : 0,
    image:old?.image||"",
    backImage:old?.backImage||"",
    favorite:old?.favorite||false
  };
  const finish=()=>{
    if(editingIndex!==null) cards[editingIndex]=base;
    else cards.push(base);
    localStorage.setItem("aikatsuEncoreCards",JSON.stringify(cards));
    fillFilters(); render(); closeModal();
  };
  const readBack=()=>{
    if(!backFile){ finish(); return; }
    const r=new FileReader();
    r.onload=e=>{base.backImage=e.target.result;finish();};
    r.readAsDataURL(backFile);
  };
  if(frontFile){
    const r=new FileReader();
    r.onload=e=>{base.image=e.target.result;readBack();};
    r.readAsDataURL(frontFile);
  }else{
    readBack();
  }
}


function clearFilters(){
  ["search","series","ownership","type","brand","rarity","character"].forEach(id=>$(id).value="");
  $("sortBy").value="cardNumber-asc";
  $("favoriteFilter").checked=false;
  render();
}

$("detailToggle").addEventListener("click",()=>{
  const open=$("detailSearch").classList.toggle("open");
  $("detailToggle").classList.toggle("open",open);
});

["search","series","ownership","type","brand","rarity","character","sortBy","favoriteFilter"].forEach(id=>$(id).addEventListener("input",render));
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("previewClose").addEventListener("click",closePreview);
$("previewEditBtn").addEventListener("click",()=>{const i=previewingIndex;if(i===null)return;$("previewModal").style.display="none";previewingIndex=null;editCard(i);});
$("previewModal").addEventListener("click",e=>{if(e.target===$("previewModal"))closePreview()});

$("showFrontBtn").addEventListener("click",()=>setPreviewSide("front"));
$("showBackBtn").addEventListener("click",()=>setPreviewSide("back"));
$("saveBtn").addEventListener("click",saveCard);
fillFilters();
render();



let deleteConfirmMode="";

function resetDeleteButtons(){
  deleteConfirmMode="";
  if($("deleteBtn")) $("deleteBtn").textContent="削除する";
  if($("previewDeleteBtn")) $("previewDeleteBtn").textContent="削除する";
}

function deleteUsingRealIndex(source,e){
  if(e){e.preventDefault();e.stopPropagation();}

  const btn=source==="preview" ? $("previewDeleteBtn") : $("deleteBtn");
  const index=source==="preview" ? previewingIndex : editingIndex;

  if(index===null || !Number.isInteger(Number(index)) || Number(index)<0 || Number(index)>=cards.length){
    btn.textContent="削除対象を取得できません";
    return false;
  }

  if(deleteConfirmMode!==source){
    resetDeleteButtons();
    deleteConfirmMode=source;
    btn.textContent="もう一度押すと削除";
    return false;
  }

  const i=Number(index);
  cards.splice(i,1);
  localStorage.setItem("aikatsuEncoreCards",JSON.stringify(cards));

  editingIndex=null;
  previewingIndex=null;
  resetDeleteButtons();
  $("modal").style.display="none";
  $("previewModal").style.display="none";
  fillFilters();
  render();
  return false;
}

$("previewDeleteBtn").onclick=function(e){return deleteUsingRealIndex("preview",e);};
$("deleteBtn").onclick=function(e){return deleteUsingRealIndex("edit",e);};

if("serviceWorker" in navigator && location.protocol!=="file:"){
window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
